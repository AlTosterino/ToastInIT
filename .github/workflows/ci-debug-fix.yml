name: Temporary CI reproduction

on:
  push:
    branches: [fix-ci-legal-pages]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Run lint
        run: npm run lint
      - name: Run Astro check
        run: npm run check
      - name: Run tests
        run: npm run test
      - name: Run build
        run: npm run build
      - name: Build search index
        run: npm run search:index
